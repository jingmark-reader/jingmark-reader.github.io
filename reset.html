<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JingMark — Reset Password</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div class="logo">
    <div class="logo-mark"></div>
    <span class="logo-text">JingMark</span>
  </div>

  <div id="alert" class="alert hidden"></div>

  <div class="card text-center">
    <h1 style="font-size:22px;margin-bottom:8px;">Set New Password</h1>
    <p class="text-muted mb-24" id="subTitle">Enter your new password below</p>
    <form id="resetForm" onsubmit="return doReset(event)">
      <div class="form-group">
        <label class="form-label" for="password" id="lblPass">New Password</label>
        <input class="form-input" type="password" id="password" placeholder="********" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password2" id="lblConfirm">Confirm Password</label>
        <input class="form-input" type="password" id="password2" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset Password</button>
    </form>
    <div id="loginLink" style="display:none;margin-top:16px;">
      <a href="https://jingmark.github.io">Back to Home</a>
    </div>
  </div>

  <div class="page-footer">
    <p>JingMark · <a href="index.html">Home</a> · <a href="login.html">Login</a></p>
  </div>
</div>
<script>
const API = 'https://jingmark-api.fenghua25.workers.dev';
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

// Detect language from browser
const isZh = navigator.language.startsWith('zh');
const T = isZh ? {
  title:'设置新密码', subTitle:'请在下方输入新密码',
  lblPass:'新密码', lblConfirm:'确认密码', btn:'重置密码',
  errEmpty:'请填写所有字段', errShort:'密码至少 8 位', errMatch:'两次密码不一致',
  errToken:'链接无效或已过期，请重新申请重置', errFail:'操作失败，请重试',
  success:'密码重置成功！正在跳转登录...', loginLink:'返回首页'
} : {
  title:'Set New Password', subTitle:'Enter your new password below',
  lblPass:'New Password', lblConfirm:'Confirm Password', btn:'Reset Password',
  errEmpty:'Please fill in all fields', errShort:'Password must be at least 8 characters', errMatch:'Passwords do not match',
  errToken:'Link is invalid or expired. Please request a new reset link.', errFail:'Operation failed. Please try again.',
  success:'Password reset successful! Redirecting to login...', loginLink:'Back to Home'
};

// Apply text
document.getElementById('subTitle').textContent = T.subTitle;
document.getElementById('lblPass').textContent = T.lblPass;
document.getElementById('lblConfirm').textContent = T.lblConfirm;
document.getElementById('submitBtn').textContent = T.btn;

if(!token){
  showAlert('error', T.errToken);
  document.getElementById('resetForm').style.display = 'none';
}

function showAlert(type, msg){
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
}

async function doReset(e){
  e.preventDefault();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if(!password || !password2){ showAlert('error', T.errEmpty); return false; }
  if(password.length < 8){ showAlert('error', T.errShort); return false; }
  if(password !== password2){ showAlert('error', T.errMatch); return false; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  try {
    const res = await fetch(API + '/api/auth/reset-confirm', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, password})
    });
    const data = await res.json();

    if(data.ok){
      showAlert('success', T.success);
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('loginLink').style.display = 'block';
      document.querySelector('#loginLink a').textContent = T.loginLink;
      setTimeout(() => { window.location.href = 'https://jingmark.github.io'; }, 3000);
    } else {
      showAlert('error', data.error === 'Invalid or expired token' || data.error === 'Token expired' ? T.errToken : T.errFail);
    }
  } catch {
    showAlert('error', T.errFail);
  }
  btn.disabled = false;
  return false;
}
</script>
</body>
</html>
